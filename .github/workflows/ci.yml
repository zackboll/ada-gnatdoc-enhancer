name: Python toolkit qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline-core package in editable mode
        run: python -m pip install -e .
      - name: Unit and mutation tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic four-profile conformance
        run: gnatdoc-enhancer conformance --fixtures tests/fixtures
      - name: Compile and CLI checks
        run: |
          python -m compileall -q src
          gnatdoc-enhancer --version
  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and install from artifact
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/enhancer-wheel-smoke
          /tmp/enhancer-wheel-smoke/bin/pip install dist/*.whl
          /tmp/enhancer-wheel-smoke/bin/gnatdoc-enhancer --version
