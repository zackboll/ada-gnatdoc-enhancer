name: Python toolkit qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline-core package in editable mode
        run: python -m pip install -e '.[guides]'
      - name: Authentic source-backed authored guide and portal qualification
        run: python -m unittest discover -s tests -p test_authored.py -v
      - name: Unit and mutation tests
        run: python -m unittest discover -s tests -v
      - name: Source-verified declaration profiles (authentic excerpts and synthetic mutations)
        run: |
          python -m unittest discover -s tests -p test_declaration_profiles.py -v
          python -m unittest discover -s tests -p test_mel_profiles.py -v
      - name: Synthetic four-profile conformance
        run: gnatdoc-enhancer conformance --fixtures tests/fixtures
      - name: Pinned external dependency reduced-fixture and adversarial qualification
        run: python -m unittest discover -s tests -p test_external_types.py -v
      # Full-site and Chromium evidence remains a separate offline qualification.
      - name: Authentic generic-instance reduced fixture and adversarial qualification
        run: python -m unittest discover -s tests -p test_generic_instances.py -v
      # Unit discovery above includes pinned authentic reduced fixtures. Hosted
      # CI does NOT generate/certify four complete consumer documentation sites.
      - name: Authentic reduced real-site CLI qualification (not full-site certification)
        run: |
          gnatdoc-enhancer qualify --spec tests/real-fixtures/geometry/input.json --source-root tests/real-fixtures/geometry/source --site "$GITHUB_WORKSPACE/tests/real-fixtures/geometry/pristine" --workspace "$RUNNER_TEMP/real-geometry"
      - name: Compile and CLI checks
        run: |
          python -m compileall -q src
          gnatdoc-enhancer --version
  wheel:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build --wheel --sdist
          python -m twine check --strict dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/enhancer-wheel-smoke"
          "$RUNNER_TEMP/enhancer-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/enhancer-wheel-smoke/bin/python" -m pip install markdown-it-py==3.0.0 mdurl==0.1.2
      - name: Installed CLI, assets and four-profile conformance outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          unset PYTHONPATH
          "$RUNNER_TEMP/enhancer-wheel-smoke/bin/gnatdoc-enhancer" --help
          "$RUNNER_TEMP/enhancer-wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/test_installed.py" --fixtures "$GITHUB_WORKSPACE/tests/fixtures"
          "$RUNNER_TEMP/enhancer-wheel-smoke/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Extract source distribution and independently build its wheel
        run: |
          mkdir "$RUNNER_TEMP/sdist-source"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist-source"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/sdist-wheel" "$RUNNER_TEMP"/sdist-source/ada_gnatdoc_enhancer-*
          python -m venv "$RUNNER_TEMP/enhancer-sdist-smoke"
          "$RUNNER_TEMP/enhancer-sdist-smoke/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/sdist-wheel/*.whl
          "$RUNNER_TEMP/enhancer-sdist-smoke/bin/python" -m pip install markdown-it-py==3.0.0 mdurl==0.1.2
      - name: Audit archive metadata, complete test inputs and source/module/asset identities
        run: |
          python scripts/check_distributions.py --source "$GITHUB_WORKSPACE" --wheel dist/*.whl --sdist dist/*.tar.gz --rebuilt "$RUNNER_TEMP"/sdist-wheel/*.whl > dist/content-audit.json
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Qualify tests and fixtures shipped in the source distribution
        working-directory: ${{ runner.temp }}
        run: |
          cd sdist-source/ada_gnatdoc_enhancer-*
          unset PYTHONPATH
          "$RUNNER_TEMP/enhancer-sdist-smoke/bin/python" -m unittest discover -s tests -v
          "$RUNNER_TEMP/enhancer-sdist-smoke/bin/python" scripts/test_installed.py --fixtures tests/fixtures
          "$RUNNER_TEMP/enhancer-sdist-smoke/bin/gnatdoc-enhancer" conformance --fixtures tests/fixtures
      - name: Retain candidate artifacts and content audit (not a release publication)
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-python-${{ matrix.python }}
          path: dist/
          retention-days: 30
