<link rel=stylesheet href=gnatdoc.css><body class=content><h1>OpenCV.Core.UInt8_Vec4</h1><h2>Entities</h2><h2>Description</h2><p>One complete CV_8UC4 Mat element (4 bytes). Components 0 .. 3 are OpenCV channel indices holding unsigned 0 .. 255 values; no semantic channel meaning is assigned. It corresponds to the native Vec4b (uchar) alias.
