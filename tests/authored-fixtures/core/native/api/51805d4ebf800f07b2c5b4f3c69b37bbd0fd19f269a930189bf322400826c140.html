<link rel=stylesheet href=gnatdoc.css><body class=content><h1>OpenCV.Core.UInt8_Vec3</h1><h2>Entities</h2><h2>Description</h2><p>One complete CV_8UC3 Mat element (3 bytes). Components 0 .. 2 are OpenCV channel indices holding unsigned 0 .. 255 values; no semantic channel meaning (such as blue-green-red order) is assigned. It corresponds to the native Vec3b (uchar) alias.
