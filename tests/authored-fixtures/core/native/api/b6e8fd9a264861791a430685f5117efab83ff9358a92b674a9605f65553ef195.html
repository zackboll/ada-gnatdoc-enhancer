<link rel=stylesheet href=gnatdoc.css><body class=content><h1>OpenCV.Core.UInt16_Vec2</h1><h2>Entities</h2><h2>Description</h2><p>One complete CV_16UC2 Mat element (4 bytes). Components 0 .. 1 are OpenCV channel indices holding unsigned 0 .. 65535 values; no semantic channel meaning is assigned. It corresponds to the native Vec2w (ushort) alias.
