<link rel=stylesheet href=gnatdoc.css><body class=content><h1>OpenCV.Core.Float32_Vec2</h1><h2>Entities</h2><h2>Description</h2><p>One complete CV_32FC2 Mat element (8 bytes). Components 0 .. 1 are OpenCV channel indices holding single-precision floating-point values; no semantic channel meaning is assigned. It corresponds to the native Vec2f (float) alias.
