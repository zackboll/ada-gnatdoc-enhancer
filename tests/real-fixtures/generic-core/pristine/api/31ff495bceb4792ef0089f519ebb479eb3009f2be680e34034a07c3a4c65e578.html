<link rel=stylesheet href=gnatdoc.css><body class=content><h1>OpenCV.Core.Float32_Vec4</h1><h2>Entities</h2><h2>Description</h2><p>One complete CV_32FC4 Mat element (16 bytes). Components 0 .. 3 are OpenCV channel indices holding single-precision floating-point values; no semantic channel meaning is assigned. It corresponds to the native Vec4f (float) alias.
