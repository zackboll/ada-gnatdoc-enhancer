<link rel=stylesheet href=gnatdoc.css><body class=content><h1>OpenCV.Core.Float64_Vec4</h1><h2>Entities</h2><h2>Description</h2><p>One complete CV_64FC4 Mat element (32 bytes). Components 0 .. 3 are OpenCV channel indices holding double-precision floating-point values; no semantic channel meaning is assigned. It corresponds to the native Vec4d (double) alias.
