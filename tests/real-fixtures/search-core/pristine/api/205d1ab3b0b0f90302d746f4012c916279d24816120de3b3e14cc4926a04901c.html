<link rel=stylesheet href=gnatdoc.css><body class=content><h1>OpenCV.Core.Int16_Vec4</h1><h2>Entities</h2><h2>Description</h2><p>One complete CV_16SC4 Mat element (8 bytes). Components 0 .. 3 are OpenCV channel indices holding signed -32768 .. 32767 values; no semantic channel meaning is assigned. It corresponds to the native Vec4s (short) alias.
