<link rel=stylesheet href=gnatdoc.css><body class=content><h1>OpenCV.Core.Float32_Vec3</h1><h2>Entities</h2><h2>Description</h2><p>One complete CV_32FC3 Mat element (12 bytes). Components 0 .. 2 are OpenCV channel indices holding single-precision floating-point values; no semantic channel meaning is assigned. It corresponds to the native Vec3f (float) alias.
