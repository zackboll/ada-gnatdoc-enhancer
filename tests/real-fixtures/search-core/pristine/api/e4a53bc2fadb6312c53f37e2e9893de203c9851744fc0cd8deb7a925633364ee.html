<link rel=stylesheet href=gnatdoc.css><body class=content><h1>OpenCV.Core.UInt8_Vec2</h1><h2>Entities</h2><h2>Description</h2><p>One complete CV_8UC2 Mat element (2 bytes). Components 0 .. 1 are OpenCV channel indices holding unsigned 0 .. 255 values; no semantic channel meaning is assigned. It corresponds to the native Vec2b (uchar) alias.
