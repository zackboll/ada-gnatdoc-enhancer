<link rel=stylesheet href=gnatdoc.css><body class=content><h1>OpenCV.Core.Int32_Vec3</h1><h2>Entities</h2><h2>Description</h2><p>One complete CV_32SC3 Mat element (12 bytes). Components 0 .. 2 are OpenCV channel indices holding signed 32-bit integers; no semantic channel meaning is assigned. It corresponds to the native Vec3i (int) alias.
