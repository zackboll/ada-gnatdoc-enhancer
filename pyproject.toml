[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-gnatdoc-enhancer"
version = "0.1.4"
description = "Offline source-verified GNATdoc 26 HTML enhancement and validation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Ada GNATdoc Enhancer contributors"}]
keywords = ["ada", "gnatdoc", "documentation", "html", "static-site"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zackboll/ada-gnatdoc-enhancer"
Repository = "https://github.com/zackboll/ada-gnatdoc-enhancer"
Issues = "https://github.com/zackboll/ada-gnatdoc-enhancer/issues"

[project.optional-dependencies]
guides = ["markdown-it-py==3.0.0", "mdurl==0.1.2"]

[project.scripts]
gnatdoc-enhancer = "ada_gnatdoc_enhancer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ada_gnatdoc_enhancer = ["assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
